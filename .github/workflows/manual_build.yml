name: "Manual Build"
on:
  workflow_dispatch:
    inputs:
      head_ref:
        description: 'Branch to build'
        required: false
        default: main
      version:
        description: 'Marketing version (optional)'
        required: false
      build_number:
        description: 'Build number (optional)'
        required: false
# Manual artifact build. Version inputs affect the artifact without modifying the repository.
permissions:
  contents: read


jobs:
  build:
    name: Build and sign app
    uses: ./.github/workflows/build_reusable.yml
    with:
      head_ref: ${{ github.event.inputs.head_ref || github.ref_name || 'main' }}
      version: ${{ github.event.inputs.version || '' }}
      build_number: ${{ github.event.inputs.build_number || '' }}
    secrets: inherit
