name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parse version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/release_version.py "$TAG"

  build:
    name: Build tagged commit
    needs: prepare
    uses: ./.github/workflows/build_reusable.yml
    with:
      head_ref: ${{ github.ref }}
      version: ${{ needs.prepare.outputs.version }}
      build_number: ${{ github.run_number }}
    secrets: inherit

  publish:
    name: Publish GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download DMG
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: FlowDock.dmg
          path: Release

      - name: Report signing state
        env:
          SIGNING_MODE: ${{ needs.build.outputs.signing_mode }}
        run: |
          if [[ "$SIGNING_MODE" != "developer-id" ]]; then
            echo "::warning::This release was built in '$SIGNING_MODE' mode. The DMG is neither Developer ID signed nor notarized, so macOS will quarantine it. Publish it only as an internal build."
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--verify-tag --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" Release/FlowDock.dmg "${flags[@]}"

      # The app reads SUFeedURL https://arnavbonigala.github.io/FlowDock/appcast.xml,
      # which GitHub Pages serves from the gh-pages branch alongside the download page.
      # That branch has no source in this repository: this step is what creates and
      # maintains it, from updater/. appcast.xml is seeded only the first time, since
      # after that the branch holds the release history; the page is copied every time.
      - name: Publish appcast and download page
        if: needs.build.outputs.ed_signature != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ needs.build.outputs.build_number }}
          ED_SIGNATURE: ${{ needs.build.outputs.ed_signature }}
          DMG_LENGTH: ${{ needs.build.outputs.dmg_length }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          remote="${APPCAST_REMOTE:-https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git}"
          work="$(mktemp -d)"
          if git clone --branch gh-pages --single-branch --depth 1 "$remote" "$work"; then
            echo "Updating the existing gh-pages feed."
          else
            echo "Creating the gh-pages branch."
            git clone --depth 1 "$remote" "$work"
            git -C "$work" checkout --orphan gh-pages
            git -C "$work" rm -rqf . || true
            cp updater/appcast.xml "$work/appcast.xml"
          fi
          [[ -f "$work/appcast.xml" ]] || cp updater/appcast.xml "$work/appcast.xml"
          # The landing page is redeployed every release, so editing updater/index.html
          # on main is what changes the published page.
          cp updater/index.html updater/flowdock.png "$work/"
          channel=()
          if [[ "$PRERELEASE" == "true" ]]; then
            channel=(--channel beta)
          fi
          python3 scripts/appcast.py "$work/appcast.xml" \
            --version "$VERSION" \
            --build "$BUILD_NUMBER" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/FlowDock.dmg" \
            --length "$DMG_LENGTH" \
            --signature "$ED_SIGNATURE" \
            "${channel[@]}"
          git -C "$work" config user.name "github-actions[bot]"
          git -C "$work" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$work" add appcast.xml index.html flowdock.png
          git -C "$work" commit -m "Publish FlowDock $VERSION to the update feed"
          git -C "$work" push "$remote" gh-pages

      - name: Report missing appcast
        if: needs.build.outputs.ed_signature == ''
        run: |
          echo "::warning::No appcast entry was published because SPARKLE_ED_PRIVATE_KEY is not configured. Existing installations will not be offered this release; they must download it by hand."
